<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" fill="#FAFAF8"/>
  <rect x="0" y="0" width="256" height="6" fill="#002FA7"/>

  <text x="128" y="42" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" font-weight="700" fill="#002FA7" letter-spacing="6">确认安装</text>

  <!-- 主图：对话框 + 大问号 + 蓝色 YES 勾 -->
  <g transform="translate(128, 138)">
    <!-- 对话框 -->
    <rect x="-78" y="-66" width="156" height="100" fill="#fff" stroke="#0A0A0A" stroke-width="3" rx="6"/>
    <!-- 黑色标题栏 -->
    <path d="M-78,-66 L78,-66 L78,-44 L-78,-44 Z" fill="#0A0A0A"/>
    <text x="0" y="-50" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#FAFAF8">确定安装？</text>

    <!-- 内容行：钥匙 + 文件 -->
    <g transform="translate(-30, 4)">
      <circle cx="0" cy="0" r="14" fill="#fff" stroke="#002FA7" stroke-width="3"/>
      <path d="M-5,0 L-2,3 L5,-5" stroke="#002FA7" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(0, 4)">
      <rect x="-12" y="-10" width="24" height="20" fill="none" stroke="#737373" stroke-width="2"/>
      <line x1="-12" y1="-3" x2="12" y2="-3" stroke="#737373" stroke-width="2"/>
    </g>
    <g transform="translate(30, 4)">
      <circle cx="0" cy="0" r="14" fill="#fff" stroke="#002FA7" stroke-width="3"/>
      <path d="M-5,0 L-2,3 L5,-5" stroke="#002FA7" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- 大蓝色 YES 勾（压在 dialog 右下，模拟"点 YES 后") -->
    <g transform="translate(48, 50)">
      <circle r="26" fill="#002FA7" stroke="#0A0A0A" stroke-width="3"/>
      <path d="M-12,0 L-3,10 L14,-12" stroke="#FAFAF8" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <line x1="32" y1="216" x2="224" y2="216" stroke="#D4D4D2" stroke-width="1"/>
  <text x="32" y="232" font-family="IBM Plex Mono,monospace" font-size="10" letter-spacing="1.5" fill="#0A0A0A">04</text>
  <text x="224" y="232" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="600" fill="#002FA7">6 件 · 确认</text>
</svg>