<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" fill="#FAFAF8"/>
  <rect x="0" y="0" width="256" height="6" fill="#002FA7"/>

  <text x="128" y="42" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" font-weight="700" fill="#002FA7" letter-spacing="6">权限清单</text>

  <!-- 主图：锁 + 钥匙 + 周围6个权限标签点 -->
  <g transform="translate(128, 134)">
    <!-- 6 个权限"洞"环绕（= 12 字段中的几个简化成环） -->
    <g fill="none" stroke="#0A0A0A" stroke-width="2">
      <circle cx="0" cy="-78" r="11"/>
      <circle cx="68" cy="-39" r="11"/>
      <circle cx="68" cy="39" r="11"/>
      <circle cx="0" cy="78" r="11"/>
      <circle cx="-68" cy="39" r="11"/>
      <circle cx="-68" cy="-39" r="11"/>
    </g>
    <g font-family="IBM Plex Mono,monospace" font-size="9" font-weight="700" fill="#002FA7" text-anchor="middle">
      <text x="0" y="-75">fs</text>
      <text x="68" y="-36">net</text>
      <text x="68" y="42">exec</text>
      <text x="0" y="81">env</text>
      <text x="-68" y="42">cap</text>
      <text x="-68" y="-36">ui</text>
    </g>
    <!-- 中心大锁 -->
    <g>
      <rect x="-22" y="-10" width="44" height="36" rx="4" fill="#002FA7" stroke="#0A0A0A" stroke-width="3"/>
      <path d="M-14,-10 L-14,-26 a14 14 0 0 1 28 0 L 14,-10" fill="none" stroke="#0A0A0A" stroke-width="4" stroke-linecap="round"/>
      <circle cx="0" cy="6" r="3.5" fill="#FAFAF8"/>
      <line x1="0" y1="6" x2="0" y2="16" stroke="#FAFAF8" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <line x1="32" y1="216" x2="224" y2="216" stroke="#D4D4D2" stroke-width="1"/>
  <text x="32" y="232" font-family="IBM Plex Mono,monospace" font-size="10" letter-spacing="1.5" fill="#0A0A0A">02</text>
  <text x="224" y="232" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="600" fill="#002FA7">6 件 · 清单</text>
</svg>