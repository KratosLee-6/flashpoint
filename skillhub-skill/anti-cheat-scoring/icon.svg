<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" fill="#FAFAF8"/>
  <rect x="0" y="0" width="256" height="6" fill="#002FA7"/>

  <!-- 中文副标 -->
  <text x="128" y="42" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" font-weight="700" fill="#002FA7" letter-spacing="6">信号防刷</text>

  <!-- 主图：盾牌挡住赞（点赞 = 圆点） -->
  <g transform="translate(128, 132)">
    <!-- 盾 -->
    <path d="M0,-72 L52,-52 L52,8 Q52,52 0,68 Q-52,52 -52,8 L-52,-52 Z"
          fill="#002FA7" stroke="#0A0A0A" stroke-width="3"/>
    <!-- 盾内：勾 -->
    <path d="M-22,4 L-8,20 L24,-18" stroke="#FAFAF8" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 3 个「赞」被挡在外面（带 ×） -->
    <g fill="#D4D4D2" font-family="Inter,sans-serif">
      <circle cx="-86" cy="-30" r="14"/>
      <text x="-86" y="-25" text-anchor="middle" font-size="14" font-weight="700" fill="#0A0A0A">★</text>
      <line x1="-104" y1="-46" x2="-68" y2="-14" stroke="#FAFAF8" stroke-width="3"/>

      <circle cx="92" cy="-12" r="14"/>
      <text x="92" y="-7" text-anchor="middle" font-size="14" font-weight="700" fill="#0A0A0A">♥</text>
      <line x1="76" y1="-30" x2="108" y2="6" stroke="#FAFAF8" stroke-width="3"/>

      <circle cx="-90" cy="38" r="14"/>
      <text x="-90" y="43" text-anchor="middle" font-size="14" font-weight="700" fill="#0A0A0A">+</text>
      <line x1="-108" y1="20" x2="-72" y2="56" stroke="#FAFAF8" stroke-width="3"/>
    </g>
  </g>

  <line x1="32" y1="216" x2="224" y2="216" stroke="#D4D4D2" stroke-width="1"/>
  <text x="32" y="232" font-family="IBM Plex Mono,monospace" font-size="10" letter-spacing="1.5" fill="#0A0A0A">01</text>
  <text x="224" y="232" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="600" fill="#002FA7">6 件 · 防刷</text>
</svg>