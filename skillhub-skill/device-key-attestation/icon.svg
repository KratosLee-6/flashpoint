<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" fill="#FAFAF8"/>
  <rect x="0" y="0" width="256" height="6" fill="#002FA7"/>

  <text x="128" y="42" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" font-weight="700" fill="#002FA7" letter-spacing="6">设备鉴权</text>

  <!-- 主图：两台设备（手机 vs 电脑）+ 不同状态（× vs ✓） -->
  <g transform="translate(128, 134)">
    <!-- 左：电脑屏幕（被冒充） -->
    <g transform="translate(-46, 0)">
      <!-- 显示器外框 -->
      <rect x="-26" y="-32" width="52" height="40" rx="3" fill="#fff" stroke="#0A0A0A" stroke-width="3"/>
      <!-- 屏内像素点（=没签名 = 失败） -->
      <g fill="#c0392b">
        <circle cx="-14" cy="-22" r="2"/>
        <circle cx="-6" cy="-22" r="2"/>
        <circle cx="2" cy="-22" r="2"/>
        <circle cx="10" cy="-22" r="2"/>
        <circle cx="-14" cy="-14" r="2"/>
        <circle cx="-6" cy="-14" r="2"/>
        <circle cx="2" cy="-14" r="2"/>
        <circle cx="-14" cy="-6" r="2"/>
        <circle cx="-6" cy="-6" r="2"/>
      </g>
      <!-- 底座 -->
      <rect x="-16" y="8" width="32" height="6" fill="#0A0A0A"/>
      <!-- 红色大 × 覆盖 -->
      <line x1="-16" y1="-22" x2="16" y2="10" stroke="#FAFAF8" stroke-width="3.5"/>
      <line x1="16" y1="-22" x2="-16" y2="10" stroke="#FAFAF8" stroke-width="3.5"/>
    </g>

    <!-- 中：指纹 + 签章圆圈（核心"设备签名"） -->
    <g transform="translate(0, 0)">
      <circle r="34" fill="#FAFAF8" stroke="#002FA7" stroke-width="5"/>
      <circle r="34" fill="none" stroke="#0A0A0A" stroke-width="2"/>
      <!-- 简化的指纹：3 圈弧线 -->
      <path d="M-14,-4 a14 14 0 0 1 28 0" fill="none" stroke="#002FA7" stroke-width="3" stroke-linecap="round"/>
      <path d="M-10,4 a10 10 0 0 1 20 0" fill="none" stroke="#002FA7" stroke-width="3" stroke-linecap="round"/>
      <path d="M-6,12 a6 6 0 0 1 12 0" fill="none" stroke="#002FA7" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- 右：手机（真设备 + 签名） -->
    <g transform="translate(46, 0)">
      <!-- 手机外框 -->
      <rect x="-14" y="-32" width="28" height="64" rx="4" fill="#fff" stroke="#0A0A0A" stroke-width="3"/>
      <!-- 听筒 + home -->
      <rect x="-5" y="-28" width="10" height="2" fill="#737373"/>
      <circle cx="0" cy="26" r="2.5" fill="#737373"/>
      <!-- 屏内：蓝色大 ✓ -->
      <circle cx="0" cy="0" r="14" fill="#002FA7"/>
      <path d="M-6,0 L-2,5 L7,-6" stroke="#FAFAF8" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <text x="128" y="200" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#0A0A0A" letter-spacing="2">偷 token 也过不去</text>

  <line x1="32" y1="216" x2="224" y2="216" stroke="#D4D4D2" stroke-width="1"/>
  <text x="32" y="232" font-family="IBM Plex Mono,monospace" font-size="10" letter-spacing="1.5" fill="#0A0A0A">06</text>
  <text x="224" y="232" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="600" fill="#002FA7">6 件 · 鉴权</text>
</svg>