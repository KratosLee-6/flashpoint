<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" fill="#FAFAF8"/>
  <rect x="0" y="0" width="256" height="6" fill="#002FA7"/>

  <text x="128" y="42" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" font-weight="700" fill="#002FA7" letter-spacing="6">代码扫描</text>

  <!-- 主图：放大镜扫过代码（看不见的红色 "bug"） -->
  <g transform="translate(128, 132)">
    <!-- 文档 -->
    <rect x="-72" y="-60" width="108" height="120" fill="#fff" stroke="#0A0A0A" stroke-width="3" rx="3"/>
    <!-- 代码行（短横） -->
    <g stroke="#737373" stroke-width="2.5">
      <line x1="-58" y1="-44" x2="22" y2="-44"/>
      <line x1="-58" y1="-30" x2="-10" y2="-30"/>
      <line x1="-58" y1="-16" x2="14" y2="-16"/>
      <line x1="-58" y1="-2" x2="18" y2="-2"/>
      <line x1="-58" y1="12" x2="6" y2="12"/>
      <line x1="-58" y1="26" x2="20" y2="26"/>
      <line x1="-58" y1="40" x2="-8" y2="40"/>
    </g>
    <!-- 中间一行被红框圈住（=扫描发现 bug） -->
    <rect x="-60" y="-7" width="84" height="14" fill="none" stroke="#c0392b" stroke-width="2.5" rx="2"/>

    <!-- 放大镜 -->
    <g transform="translate(36, -8) rotate(20)">
      <circle r="32" fill="rgba(255,255,255,0.85)" stroke="#002FA7" stroke-width="5"/>
      <circle r="32" fill="none" stroke="#0A0A0A" stroke-width="2"/>
      <line x1="22" y1="22" x2="44" y2="44" stroke="#0A0A0A" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>

  <line x1="32" y1="216" x2="224" y2="216" stroke="#D4D4D2" stroke-width="1"/>
  <text x="32" y="232" font-family="IBM Plex Mono,monospace" font-size="10" letter-spacing="1.5" fill="#0A0A0A">03</text>
  <text x="224" y="232" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="600" fill="#002FA7">6 件 · 扫描</text>
</svg>