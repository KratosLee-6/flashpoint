<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" fill="#FAFAF8"/>
  <rect x="0" y="0" width="256" height="6" fill="#002FA7"/>

  <text x="128" y="42" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" font-weight="700" fill="#002FA7" letter-spacing="6">运行隔离</text>

  <!-- 主图：六边形围栏，里面小方块（=被围住的小程序），外面带×的红圈 = 被挡 -->
  <g transform="translate(128, 134)">
    <!-- 围栏（六边形） -->
    <polygon points="-60,-32 -30,-60 30,-60 60,-32 60,32 30,60 -30,60 -60,32"
             fill="#fff" stroke="#002FA7" stroke-width="6" stroke-linejoin="round"/>

    <!-- 中心：被围住的小方块（运行中） -->
    <rect x="-20" y="-20" width="40" height="40" rx="4" fill="#0A0A0A"/>
    <rect x="-14" y="-14" width="28" height="6" fill="#002FA7"/>
    <rect x="-14" y="-4" width="28" height="3" fill="#737373"/>
    <rect x="-14" y="2" width="20" height="3" fill="#737373"/>
    <rect x="-14" y="8" width="24" height="3" fill="#737373"/>
    <rect x="-14" y="14" width="16" height="3" fill="#002FA7"/>

    <!-- 围栏外：被挡的红色叉（=SSH 路径/外网被拦） -->
    <g transform="translate(-78, -8)">
      <circle r="14" fill="#FAFAF8" stroke="#0A0A0A" stroke-width="2.5"/>
      <line x1="-7" y1="-7" x2="7" y2="7" stroke="#c0392b" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="7" y1="-7" x2="-7" y2="7" stroke="#c0392b" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <g transform="translate(82, -8)">
      <circle r="14" fill="#FAFAF8" stroke="#0A0A0A" stroke-width="2.5"/>
      <line x1="-7" y1="-7" x2="7" y2="7" stroke="#c0392b" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="7" y1="-7" x2="-7" y2="7" stroke="#c0392b" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <g transform="translate(-78, 50)">
      <circle r="14" fill="#FAFAF8" stroke="#0A0A0A" stroke-width="2.5"/>
      <line x1="-7" y1="-7" x2="7" y2="7" stroke="#c0392b" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="7" y1="-7" x2="-7" y2="7" stroke="#c0392b" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <g transform="translate(82, 50)">
      <circle r="14" fill="#FAFAF8" stroke="#0A0A0A" stroke-width="2.5"/>
      <line x1="-7" y1="-7" x2="7" y2="7" stroke="#c0392b" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="7" y1="-7" x2="-7" y2="7" stroke="#c0392b" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>

  <line x1="32" y1="216" x2="224" y2="216" stroke="#D4D4D2" stroke-width="1"/>
  <text x="32" y="232" font-family="IBM Plex Mono,monospace" font-size="10" letter-spacing="1.5" fill="#0A0A0A">05</text>
  <text x="224" y="232" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="600" fill="#002FA7">6 件 · 隔离</text>
</svg>