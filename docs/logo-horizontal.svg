<svg xmlns="http://www.w3.org/2000/svg" width="420" height="88" viewBox="0 0 420 88">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1658F5"/>
      <stop offset="100%" stop-color="#6C93F8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="420" height="88" rx="16" fill="url(#bg)"/>
  <!-- 碰撞图形：两个方块向中间靠近，中间产生火花 -->
  <g filter="url(#glow)">
    <!-- 左方块 -->
    <rect x="28" y="28" width="26" height="26" rx="5" fill="#fff" opacity=".92" transform="rotate(-8 41 41)"/>
    <!-- 右方块 -->
    <rect x="54" y="34" width="22" height="22" rx="5" fill="#B8D0FF" opacity=".85" transform="rotate(6 65 45)"/>
    <!-- 碰撞火花 -->
    <circle cx="50" cy="44" r="4" fill="#FFD60A" opacity=".95"/>
    <circle cx="56" cy="38" r="2.5" fill="#FFD60A" opacity=".6"/>
    <circle cx="44" cy="50" r="2" fill="#FFD60A" opacity=".4"/>
  </g>
  <!-- 项目名 -->
  <text x="72" y="52" font-family="'Noto Sans SC','PingFang SC',sans-serif" font-size="28" font-weight="900" fill="#fff" letter-spacing="-.5">AI 闪光点</text>
  <!-- 副标题 -->
  <text x="228" y="52" font-family="'Inter','Noto Sans SC',sans-serif" font-size="14" font-weight="400" fill="#B8D0FF" letter-spacing=".5">Skill 碰撞台</text>
  <!-- 底部分隔线 -->
  <line x1="72" y1="62" x2="392" y2="62" stroke="#fff" stroke-opacity=".15" stroke-width="1"/>
  <text x="72" y="76" font-family="'Inter',sans-serif" font-size="10" font-weight="600" fill="#B8D0FF" letter-spacing="1.5">SKILL COLLISION WORKBENCH · LOCAL FIRST · VERIFIABLE</text>
</svg>
