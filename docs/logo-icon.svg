<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1658F5"/>
      <stop offset="100%" stop-color="#6C93F8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="44" fill="url(#bg)"/>
  <!-- 碰撞图形 -->
  <g filter="url(#glow)">
    <!-- 左方块 -->
    <rect x="38" y="58" width="48" height="48" rx="10" fill="#fff" opacity=".92" transform="rotate(-8 62 82)"/>
    <!-- 右方块 -->
    <rect x="92" y="72" width="40" height="40" rx="10" fill="#B8D0FF" opacity=".85" transform="rotate(6 112 92)"/>
    <!-- 碰撞火花 -->
    <circle cx="88" cy="92" r="8" fill="#FFD60A" opacity=".95"/>
    <circle cx="100" cy="80" r="5" fill="#FFD60A" opacity=".6"/>
    <circle cx="78" cy="104" r="4" fill="#FFD60A" opacity=".4"/>
    <circle cx="104" cy="98" r="3" fill="#FFD60A" opacity=".5"/>
  </g>
  <!-- 底部文字 -->
  <text x="100" y="156" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC',sans-serif" font-size="18" font-weight="700" fill="#B8D0FF" letter-spacing="2">闪光点</text>
  <text x="100" y="176" text-anchor="middle" font-family="'Inter',sans-serif" font-size="9" font-weight="600" fill="#8FAFE8" letter-spacing="1.5">SKILL COLLISION</text>
</svg>
