<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A4FD0"/>
      <stop offset="55%" stop-color="#1658F5"/>
      <stop offset="100%" stop-color="#4C8AFF"/>
    </linearGradient>
    <linearGradient id="sqA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCE8FF"/>
    </linearGradient>
    <linearGradient id="sqB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8D0FF"/>
      <stop offset="100%" stop-color="#8FAFE8"/>
    </linearGradient>
    <radialGradient id="spark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD60A"/>
      <stop offset="40%" stop-color="#FFC838"/>
      <stop offset="100%" stop-color="#FFB800" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0A3AA0" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="480" height="480" rx="108" fill="url(#bg)"/>

  <!-- 装饰网格点 -->
  <g opacity=".06" fill="#fff">
    <circle cx="60" cy="60" r="3"/><circle cx="100" cy="60" r="3"/><circle cx="140" cy="60" r="3"/>
    <circle cx="60" cy="100" r="3"/><circle cx="100" cy="100" r="3"/><circle cx="140" cy="100" r="3"/>
    <circle cx="60" cy="140" r="3"/><circle cx="100" cy="140" r="3"/><circle cx="140" cy="140" r="3"/>
    <circle cx="340" cy="340" r="3"/><circle cx="380" cy="340" r="3"/><circle cx="420" cy="340" r="3"/>
    <circle cx="340" cy="380" r="3"/><circle cx="380" cy="380" r="3"/><circle cx="420" cy="380" r="3"/>
    <circle cx="340" cy="420" r="3"/><circle cx="380" cy="420" r="3"/><circle cx="420" cy="420" r="3"/>
  </g>

  <!-- 左 Skill 方块（倾斜） -->
  <g filter="url(#softShadow)">
    <rect x="118" y="160" width="100" height="100" rx="22"
          fill="url(#sqA)" transform="rotate(-10 168 210)"/>
    <!-- 左方块内部：代码符号 -->
    <text x="150" y="218" text-anchor="middle" font-family="Consolas,monospace" font-size="30" font-weight="700" fill="#1658F5" transform="rotate(-10 168 210)">&lt;/&gt;</text>
  </g>

  <!-- 右 Skill 方块（倾斜，不同角度） -->
  <g filter="url(#softShadow)">
    <rect x="262" y="220" width="100" height="100" rx="22"
          fill="url(#sqB)" transform="rotate(8 312 270)"/>
    <!-- 右方块内部：齿轮/设置符号 -->
    <circle cx="312" cy="270" r="18" fill="none" stroke="#4C8AFF" stroke-width="4" transform="rotate(8 312 270)"/>
    <circle cx="312" cy="270" r="6" fill="#4C8AFF" transform="rotate(8 312 270)"/>
    <line x1="312" y1="246" x2="312" y2="258" stroke="#4C8AFF" stroke-width="4" transform="rotate(8 312 270)"/>
    <line x1="312" y1="282" x2="312" y2="294" stroke="#4C8AFF" stroke-width="4" transform="rotate(8 312 270)"/>
    <line x1="288" y1="270" x2="300" y2="270" stroke="#4C8AFF" stroke-width="4" transform="rotate(8 312 270)"/>
    <line x1="324" y1="270" x2="336" y2="270" stroke="#4C8AFF" stroke-width="4" transform="rotate(8 312 270)"/>
  </g>

  <!-- 碰撞火花（中心） -->
  <g filter="url(#glow)">
    <!-- 主火花：四角星 -->
    <path d="M240 190 C240 230 220 250 180 250 C220 250 240 270 240 310 C240 270 260 250 300 250 C260 250 240 230 240 190 Z"
          fill="url(#spark)" opacity="1"/>
    <!-- 内核亮点 -->
    <circle cx="240" cy="250" r="12" fill="#FFD60A"/>
    <circle cx="240" cy="250" r="6" fill="#fff"/>
    <!-- 外围粒子 -->
    <circle cx="196" cy="196" r="4" fill="#FFD60A" opacity=".7"/>
    <circle cx="284" cy="196" r="3" fill="#FFD60A" opacity=".5"/>
    <circle cx="196" cy="304" r="3" fill="#FFD60A" opacity=".5"/>
    <circle cx="284" cy="304" r="4" fill="#FFD60A" opacity=".7"/>
    <!-- 连接线（碰撞轨迹） -->
    <line x1="196" y1="196" x2="240" y2="250" stroke="#FFD60A" stroke-width="1.5" opacity=".3"/>
    <line x1="284" y1="196" x2="240" y2="250" stroke="#FFD60A" stroke-width="1.5" opacity=".3"/>
    <line x1="196" y1="304" x2="240" y2="250" stroke="#FFD60A" stroke-width="1.5" opacity=".3"/>
    <line x1="284" y1="304" x2="240" y2="250" stroke="#FFD60A" stroke-width="1.5" opacity=".3"/>
  </g>

  <!-- 连接弧线（两个方块之间的轨迹） -->
  <path d="M 200 280 Q 240 230 300 230" fill="none" stroke="#B8D0FF" stroke-width="2.5" opacity=".35" stroke-dasharray="6 4"/>
  <path d="M 280 310 Q 240 300 200 250" fill="none" stroke="#B8D0FF" stroke-width="2.5" opacity=".25" stroke-dasharray="6 4"/>
</svg>
