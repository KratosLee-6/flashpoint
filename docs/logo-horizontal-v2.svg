<svg xmlns="http://www.w3.org/2000/svg" width="340" height="64" viewBox="0 0 340 64">
  <defs>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- 图标区 -->
  <g>
    <rect x="2" y="8" width="36" height="36" rx="9" fill="#1658F5" transform="rotate(-8 20 26)"/>
    <rect x="18" y="20" width="28" height="28" rx="7" fill="#B8D0FF" opacity=".7" transform="rotate(6 32 34)"/>
    <path d="M28 16 C28 26 23 31 13 31 C23 31 28 36 28 46 C28 36 33 31 43 31 C33 31 28 26 28 16 Z" fill="#FFD60A" filter="url(#glow)"/>
  </g>
  <!-- 中文 -->
  <text x="54" y="42" font-family="'Noto Sans SC','PingFang SC',sans-serif" font-size="32" font-weight="900" fill="#1F2937" letter-spacing="-0.5">闪光点</text>
  <!-- 分隔线 -->
  <text x="148" y="42" font-family="'Inter',sans-serif" font-size="32" font-weight="300" fill="#D1D5DB">·</text>
  <!-- 英文 -->
  <text x="164" y="42" font-family="'Inter',sans-serif" font-size="28" font-weight="700" fill="#1658F5" letter-spacing="-.3">flashpoint</text>
  <!-- tagline -->
  <text x="54" y="58" font-family="'Noto Sans SC',sans-serif" font-size="11" fill="#9CA3AF" letter-spacing="1">SKILL COLLISION WORKBENCH</text>
</svg>
